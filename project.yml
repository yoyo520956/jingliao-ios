name: JingLiao
options:
  bundleIdPrefix: com.qingyao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 2.4.1
    CURRENT_PROJECT_VERSION: "20261021.16"
    SWIFT_VERSION: "5.9"
    ENABLE_DEBUG_DYLIB: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  JingLiao:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
      - path: Views
      - path: Resources
        buildPhase: resources
        excludes: ["Info.plist"]
    dependencies:
      - target: JingLiaoWidget
        embed: true
        codeSign: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 鲸聊
        CFBundleName: JingLiao
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 本地 API 网关需要在设备上监听一个端口供其他 App 连接
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.jingliao
        TARGETED_DEVICE_FAMILY: "1"
  JingLiaoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    info:
      path: Widget/Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qingyao.jingliao.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        CODE_SIGNING_ALLOWED: "NO"
