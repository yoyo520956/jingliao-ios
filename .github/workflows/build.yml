name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode
        run: |
          for v in 26.2 26.3 26.1 16.4; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app"; break; fi
          done
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned device)
        run: |
          set -o pipefail
          xcodebuild -project JingLiao.xcodeproj -scheme JingLiao -configuration Debug \
            -destination 'generic/platform=iOS' -quiet build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -300

      - name: Package IPA
        run: |
          APP=$(ls -d ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Debug-iphoneos/*.app | head -1)
          echo "APP=$APP"
          test -f "$APP/JingLiao" || { echo "主二进制缺失"; exit 1; }
          rm -rf Payload JingLiao.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JingLiao.ipa Payload
          ls -la JingLiao.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: jingliao-ipa
          path: JingLiao.ipa
